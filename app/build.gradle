plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nodpi.ambient'
    compileSdk 34

    defaultConfig {
        applicationId "com.nodpi.ambient"
        minSdk 19
        targetSdk 19
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
